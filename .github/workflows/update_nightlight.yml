name: "Monthly Nightlight Update"

on:
  schedule:
    - cron: "0 8 5 * *"   # Día 5 de cada mes, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nightlight:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install earthaccess rasterio numpy pandas requests

      - name: Download and process NASA VIIRS
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: |
          cd real_live
          python nightlight_auto.py

      - name: Commit updated nightlight data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add real_data/nightlight_guayaquil_2023.csv || true
          git diff --staged --quiet || git commit -m "auto: nightlight update $(date -u +%Y-%m)"
          git push || echo "Nada que hacer"
